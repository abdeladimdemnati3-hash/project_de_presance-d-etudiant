{% extends 'base.html' %}
{% block title %}Rapports{% endblock %}
{% block active_rapports %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-bar-chart-line me-2 text-warning"></i>Rapports & Statistiques</h4>
</div>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white py-3"><span class="fw-semibold">Générer un rapport</span></div>
    <div class="card-body">
        <form method="get" action="{% url 'generer_rapport' %}">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-medium">Filière</label>
                    <select name="filiere" class="form-select">
                        <option value="">Toutes les filières</option>
                        {% for f in filieres %}
                        <option value="{{ f.pk }}">{{ f.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-medium">Groupe</label>
                    <select name="groupe" class="form-select">
                        <option value="">Tous les groupes</option>
                        {% for g in groupes %}
                        <option value="{{ g.pk }}">{{ g.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-medium">Date début</label>
                    <input type="date" name="date_debut" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-medium">Date fin</label>
                    <input type="date" name="date_fin" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search me-1"></i>Voir
                    </button>
                    <button type="submit" name="format" value="excel" class="btn btn-success">
                        <i class="bi bi-file-earmark-excel"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
