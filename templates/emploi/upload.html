{% extends 'base.html' %}
{% block title %}Uploader un emploi du temps{% endblock %}
{% block active_emploi %}active{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4 gap-3">
    <a href="{% url 'emploi_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Retour
    </a>
    <h4 class="fw-bold mb-0"><i class="bi bi-upload me-2 text-primary"></i>Uploader un emploi du temps</h4>
</div>

<div class="card border-0 shadow-sm" style="max-width:600px;">
    <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium">Groupe <span class="text-danger">*</span></label>
                <select name="groupe" class="form-select" required>
                    <option value="">— Sélectionner un groupe —</option>
                    {% for g in groupes %}
                    <option value="{{ g.pk }}">{{ g.nom }} — {{ g.filiere.nom }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Titre</label>
                <input type="text" name="titre" class="form-control"
                       placeholder="Ex : Emploi S1 — DEV-101" maxlength="150">
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Année scolaire</label>
                <input type="text" name="annee_scolaire" class="form-control"
                       value="2025-2026" maxlength="20">
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium">Fichier (image ou PDF) <span class="text-danger">*</span></label>
                <input type="file" name="fichier" class="form-control"
                       accept=".jpg,.jpeg,.png,.gif,.webp,.pdf" required>
                <div class="form-text">Formats acceptés : JPG, PNG, GIF, WEBP, PDF</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-cloud-upload me-2"></i>Enregistrer
            </button>
        </form>
    </div>
</div>
{% endblock %}
